name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Safe placeholders only. The CI build must not receive real secrets.
  NEXT_PUBLIC_SANITY_PROJECT_ID: ci000000
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2025-07-25"
  SANITY_WRITE_TOKEN: ci-placeholder-write-token
  AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
  AUTH_GITHUB_ID: ci-placeholder-github-id
  AUTH_GITHUB_SECRET: ci-placeholder-github-secret
  AUTH_TRUST_HOST: "true"
  SENTRY_AUTH_TOKEN: ""

jobs:
  verify:
    name: Install, lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

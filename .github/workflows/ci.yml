name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Safe placeholders only. The CI build must not receive real secrets.
  NEXT_PUBLIC_SANITY_PROJECT_ID: ci000000
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2025-07-25"
  SANITY_WRITE_TOKEN: ci-placeholder-write-token
  AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
  AUTH_GITHUB_ID: ci-placeholder-github-id
  AUTH_GITHUB_SECRET: ci-placeholder-github-secret

jobs:
  verify:
    name: Install, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Known failures on main. Keep these visible but non-blocking until the
      # issues in docs/KNOWN_ISSUES.md are fixed.
      - name: Lint (informational; known failures)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck (informational; known failures)
        run: npm run typecheck
        continue-on-error: true

      # Skip prebuild typegen: it calls the Sanity CLI, which requires a real
      # project login/token. Generated sanity/types.ts is committed, so this
      # still compiles the application with placeholder env values.
      - name: Build (without authenticated typegen)
        run: npm run build --ignore-scripts
